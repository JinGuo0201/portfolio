    <!-- ======================= Main ======================= -->
    <main class="main-content">
      <div class="page-wrap">

        <!-- ============ 页面标题 ============ -->
        <div class="page-hero">
          <h1 class="page-title">联系方式</h1>
        </div>

        <div class="contact-wrap">
          <div class="contact-grid">

            <!-- 左侧：联系信息 -->
            <div class="contact-info">
              <div>
                <h3 class="contact-info-title">联系我</h3>
                <p class="contact-info-desc">
                  以下为本人的联络方式，右侧在线留言中填写的内容将直接发送至本人邮箱。
                </p>
              </div>

              <div class="contact-cards">
                <div class="contact-card">
                  <svg class="contact-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                  <div>
                    <p class="contact-card-label">电话</p>
                    <a href="tel:1324466925" class="contact-card-value link">1324466925</a>
                  </div>
                </div>

                <div class="contact-card">
                  <svg class="contact-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                  <div>
                    <p class="contact-card-label">邮箱</p>
                    <a href="mailto:guojin020201@163.com" class="contact-card-value link">guojin020201@163.com</a>
                  </div>
                </div>

                <div class="contact-card">
                  <svg class="contact-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                  <div>
                    <p class="contact-card-label">所在地</p>
                    <p class="contact-card-value">长春市 · 中国科学院东北地理与农业生态研究所</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- 右侧：在线留言表单（网页端直接投递到邮箱） -->
            <div class="contact-form-card">
              <h3 class="contact-form-title">在线留言</h3>
              <form id="contact-form" class="contact-form" novalidate>
                <div class="form-field">
                  <label for="cf-name" class="form-label">姓名</label>
                  <input type="text" id="cf-name" name="name" class="form-input" placeholder="您的姓名" required autocomplete="name" />
                  <p class="form-error" data-error-for="cf-name"></p>
                </div>

                <div class="form-field">
                  <label for="cf-email" class="form-label">邮箱</label>
                  <input type="email" id="cf-email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" />
                  <label class="form-check">
                    <input type="checkbox" id="cf-more-contact" />
                    <span>同时留下电话或微信</span>
                  </label>
                  <p class="form-error" data-error-for="cf-email"></p>
                </div>

                <div class="form-extra hidden" id="cf-extra-fields">
                  <div class="form-extra-grid">
                    <div class="form-field">
                      <label for="cf-phone" class="form-label">电话</label>
                      <input type="tel" id="cf-phone" name="phone" class="form-input" placeholder="您的电话号码" autocomplete="tel" />
                      <p class="form-error" data-error-for="cf-phone"></p>
                    </div>
                    <div class="form-field">
                      <label for="cf-wechat" class="form-label">微信</label>
                      <input type="text" id="cf-wechat" name="wechat" class="form-input" placeholder="您的微信号" />
                      <p class="form-error" data-error-for="cf-wechat"></p>
                    </div>
                  </div>
                </div>

                <div class="form-field">
                  <label for="cf-message" class="form-label">留言内容</label>
                  <textarea id="cf-message" name="message" rows="4" class="form-input form-textarea" placeholder="请输入您的留言..." required></textarea>
                  <p class="form-error" data-error-for="cf-message"></p>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="cf-submit">
                  发送消息
                </button>

                <p class="form-status" id="cf-status" role="status" aria-live="polite"></p>
              </form>
            </div>

          </div>
        </div>

      </div>
    </main>
